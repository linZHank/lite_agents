[project]
name = "spinupax"
version = "0.1.0"
description = "Packs of RL agents"
readme = "README.md"
authors = [{ name = "linzhank", email = "linzhank@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "flax>=0.10.7",
  "orbax-checkpoint>=0.11.19",
  "tensorflow-probability>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
cpu = ["jax>=0.6.2"]
dev = [
  "gymnasium[box2d]>=1.2.0",
  "matplotlib>=3.10.3",
  "pygame>=2.6.1",
  "pyqt6>=6.9.1",
  "swig>=4.3.1",
]
gpu = ["jax[cuda12]==0.6.2"]
